baseurl: ''
permalink: pretty
title: 'M2 Water'
email: 'webmaster@arcana.com.au'
description: 'M2 Water provide specialised consultancy services.'

homepage:
  show_call_box: true

footer:
  copyright_text: 'Free Jekyll theme by <a class="zerostatic" href="https://www.zerostatic.io">www.zerostatic.io</a>. Website customization by <a class="zerostatic" href="https://arcana.com.au">Apex Arcana</a>.'

seo:
  meta_og_title: "M2 Water"
  meta_og_type: "website"
  meta_og_url: "https://m2water.com.au"
  meta_og_image: "https://m2water.com.au/images/full logo.png"
  meta_og_description: "M2 Water provide specialised consultancy services."
  google_analytics_id: ""

logo:
  mobile: "images/full logo.svg"
  desktop: "images/full logo.svg"
  desktop_height: "50px"
  show_title: false

home: 
  limit_services: 3

collections:
  services:
    output: true

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "values"
    values:
      layout: "product"
    values:
      layout: "team"

sass:
  indentWidth: 4
  style: compact # possible values: nested expanded compact compressed
  precision: 10

url: "https://m2water.com.au"

plugins:
  - jekyll-environment-variables
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
  - services.md
  - values.md

